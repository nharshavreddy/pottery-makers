<header [class.scrolled]="isScrolled">
  <div class="header-container">
    <a class="logo" routerLink="/" (click)="closeMobileMenu()">
      <div class="logo-icon">
        <span class="material-symbols-outlined">yard</span>
      </div>
      <div class="logo-text">
        <span class="logo-name">The Pottery Makers</span>
        <span class="logo-tagline">Handcrafted with Love</span>
      </div>
    </a>

    <nav class="desktop-nav">
      <a *ngFor="let link of navLinks"
         [routerLink]="link.path"
         routerLinkActive="active"
         class="nav-link">
        {{ link.label }}
      </a>
    </nav>

    <div class="header-actions">
      <button class="cart-btn" *ngIf="cartItemCount > 0">
        <span class="material-symbols-outlined">shopping_bag</span>
        <span class="cart-count">{{ cartItemCount }}</span>
      </button>
      <button class="mobile-toggle" (click)="toggleMobileMenu()">
        <span class="material-symbols-outlined">{{ isMobileMenuOpen ? 'close' : 'menu' }}</span>
      </button>
    </div>
  </div>
</header>

<div class="mobile-menu" [class.open]="isMobileMenuOpen">
  <div class="mobile-nav">
    <a *ngFor="let link of navLinks"
       (click)="navigate(link.path)"
       class="mobile-nav-link"
       routerLinkActive="active">
      <span class="material-symbols-outlined">{{ link.icon }}</span>
      <span>{{ link.label }}</span>
    </a>
  </div>
</div>

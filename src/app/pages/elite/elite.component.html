<app-hero
  title="Elite Collection"
  subtitle="Premium, sophisticated pots for discerning collectors. Where luxury meets artistic craftsmanship."
  backgroundClass="elite"
  [compact]="true">
</app-hero>

<section class="products-section section">
  <div class="container">
    <div class="section-header">
      <span class="section-tag">Premium Selection</span>
      <h2 class="section-title">Elite Craftsmanship</h2>
      <p class="section-subtitle">
        Exclusive designs for those who appreciate the finest in pottery artistry
      </p>
    </div>

    <div class="products-grid">
      <app-product-card
        *ngFor="let product of products"
        [product]="product"
        [themeColor]="'elite'"
        (addToInquiry)="addToInquiry($event)">
      </app-product-card>
    </div>

    <div class="inquiry-cta" *ngIf="!showInquiryForm">
      <button class="btn btn-primary" (click)="toggleInquiryForm()">
        <span class="material-symbols-outlined">shopping_bag</span>
        Request Pricing
      </button>
      <p class="cta-note">These are premium handcrafted pieces — contact us for personalized pricing</p>
    </div>

    <div class="inquiry-section" *ngIf="showInquiryForm">
      <app-inquiry-form formType="inquiry" themeColor="elite" (formSubmitted)="onFormSubmitted()"></app-inquiry-form>
    </div>
  </div>
</section>

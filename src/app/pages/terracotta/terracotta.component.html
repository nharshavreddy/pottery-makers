<app-hero
  title="Terracotta Collection"
  subtitle="Warm, earthy handcrafted pots that bring the beauty of traditional pottery into your space. Play with textures and colours."
  backgroundClass="terracotta"
  [compact]="true">
</app-hero>

<section class="products-section section">
  <div class="container">
    <div class="section-header">
      <span class="section-tag">Home Decor Terracotta Designs</span>
      <h2 class="section-title">Play with Textures & Colours</h2>
      <p class="section-subtitle">
        Each piece is handcrafted with love, blending traditional techniques with contemporary aesthetics
      </p>
    </div>

    <div class="products-grid">
      <app-product-card
        *ngFor="let product of products"
        [product]="product"
        [themeColor]="'terracotta'"
        (addToInquiry)="addToInquiry($event)">
      </app-product-card>
    </div>

    <div class="inquiry-cta" *ngIf="!showInquiryForm">
      <button class="btn btn-primary" (click)="toggleInquiryForm()">
        <span class="material-symbols-outlined">shopping_bag</span>
        Send Inquiry
      </button>
      <p class="cta-note">Select products above, then fill the form to send us your inquiry via WhatsApp</p>
    </div>

    <div class="inquiry-section" *ngIf="showInquiryForm">
      <app-inquiry-form
        formType="inquiry"
        themeColor="terracotta"
        (formSubmitted)="onFormSubmitted()">
      </app-inquiry-form>
    </div>
  </div>
</section>

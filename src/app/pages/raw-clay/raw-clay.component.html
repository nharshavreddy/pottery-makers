<app-hero
  title="Raw Clay"
  subtitle="Ready-to-use premium clay for potters, artists, and creative enthusiasts. Start creating today."
  backgroundClass="clay"
  [compact]="true">
</app-hero>

<section class="products-section section">
  <div class="container">
    <div class="section-header">
      <span class="section-tag">Ready to Use</span>
      <h2 class="section-title">Raw Clay Collection</h2>
      <p class="section-subtitle">
        Premium quality clay, prepared and ready for your creative projects — from beginner kits to studio packs
      </p>
    </div>

    <div class="products-grid">
      <app-product-card
        *ngFor="let product of products"
        [product]="product"
        [themeColor]="'clay'"
        (addToInquiry)="addToInquiry($event)">
      </app-product-card>
    </div>

    <div class="inquiry-cta" *ngIf="!showInquiryForm">
      <button class="btn btn-primary" (click)="toggleInquiryForm()">
        <span class="material-symbols-outlined">shopping_bag</span>
        Order Clay
      </button>
      <p class="cta-note">Contact us for bulk orders and custom clay mixes</p>
    </div>

    <div class="inquiry-section" *ngIf="showInquiryForm">
      <app-inquiry-form formType="inquiry" themeColor="clay" (formSubmitted)="onFormSubmitted()"></app-inquiry-form>
    </div>
  </div>
</section>

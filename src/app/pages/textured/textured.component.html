<app-hero
  title="Textured Pots"
  subtitle="Artistic surfaces and patterns that tell stories of craftsmanship. Feel the art beneath your fingertips."
  backgroundClass="textured"
  [compact]="true">
</app-hero>

<section class="products-section section">
  <div class="container">
    <div class="section-header">
      <span class="section-tag">Artisan Textures</span>
      <h2 class="section-title">Touch the Art</h2>
      <p class="section-subtitle">
        Every texture tells a story — explore our hand-finished collection of uniquely textured pots
      </p>
    </div>

    <div class="products-grid">
      <app-product-card
        *ngFor="let product of products"
        [product]="product"
        [themeColor]="'textured'"
        (addToInquiry)="addToInquiry($event)">
      </app-product-card>
    </div>

    <div class="inquiry-cta" *ngIf="!showInquiryForm">
      <button class="btn btn-primary" (click)="toggleInquiryForm()">
        <span class="material-symbols-outlined">shopping_bag</span>
        Send Inquiry
      </button>
      <p class="cta-note">Contact us for pricing and customization options</p>
    </div>

    <div class="inquiry-section" *ngIf="showInquiryForm">
      <app-inquiry-form formType="inquiry" themeColor="textured" (formSubmitted)="onFormSubmitted()"></app-inquiry-form>
    </div>
  </div>
</section>
